[package]
name = "yumigram-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "yumigram_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
grammers-client = "0.12.0"
grammers-mtsender = "0.12.0"
grammers-session = { version = "0.12.0", default-features = false, features = ["serde"] }
grammers-tl-types = "0.12.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "time"] }
rusqlite = { version = "0.33", features = ["bundled"] }
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
regex = "1.13.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[[bin]]
name = "test_client"
path = "src/bin/test_client.rs"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = true
