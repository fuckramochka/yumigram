name: Build Yumigram

on:
  push:
    branches:
      - yumigram
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - yumigram
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Yumigram APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Yumigram with Docker
        run: |
          docker build -t yumigram-builder .
          docker run --rm -v ${{ github.workspace }}:/home/source yumigram-builder

      - name: Find & list generated APKs
        run: |
          echo "Generated outputs:"
          find TMessagesProj/build/outputs -type f -name "*.apk" -o -name "*.aab" || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yumigram-apk
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
