name: Build Yumigram

on:
  push:
    branches:
      - yumigram
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - yumigram
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yumigram APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Yumigram with Docker
        run: |
          docker build -t yumigram-builder .
          docker run --rm -v ${{ github.workspace }}:/home/source yumigram-builder

      - name: Find & list generated APK
        run: |
          echo "Generated APK:"
          find TMessagesProj/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yumigram-arm64-v8a
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/yumigram' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: v1.0.23
          name: "Yumigram v1.0.23 (arm64-v8a)"
          body: |
            ### Yumigram Android v1.0.23 (arm64-v8a)
            - 🔝 Yumigram Settings moved to the top of Settings list
            - 🌐 3-language full localization (English, Ukrainian, Russian)
            - 📁 Re-organized Settings Hub:
              - 👻 Ghost Mode & Privacy (Anti-Delete, Secret Media, Stealth)
              - 🤖 AI Agent (Autonomous agent, Gemini 3.5/3.1, Local LLM)
              - 🎨 Interface & Spotify-style Music Player
            - 🎵 Spotify-style music player redesign with dynamic album artwork gradient
          files: |
            TMessagesProj/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
