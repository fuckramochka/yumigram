name: Build Yumigram

on:
  push:
    branches:
      - yumigram
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - yumigram
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yumigram APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^YUMI_VERSION=//p' gradle.properties | head -n 1)"
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match YUMI_VERSION=${version}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Yumigram with Docker
        run: |
          docker build -t yumigram-builder .
          docker run --rm -v ${{ github.workspace }}:/home/source yumigram-builder

      - name: Find & list generated APK
        run: |
          echo "Generated APK:"
          find TMessagesProj/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yumigram-arm64-v8a
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Yumigram ${{ github.ref_name }} (arm64-v8a)"
          body: "Yumigram Android ${{ github.ref_name }}. Built from ${{ github.sha }}."
          files: |
            TMessagesProj/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
