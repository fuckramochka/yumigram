name: Yumigram CI & Auto-Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Run Core Unit Tests
        run: |
          cargo test --manifest-path core/Cargo.toml --verbose

  build-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Native Rust Library (libyumigram_core.so)
        run: |
          export ANDROID_NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" || true
            export ANDROID_NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          fi
          echo "Using Android NDK at: $ANDROID_NDK_HOME"
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android35-clang
          export CC_aarch64_unknown_linux_android=aarch64-linux-android35-clang
          export CXX_aarch64_unknown_linux_android=aarch64-linux-android35-clang++
          cargo build --manifest-path core/Cargo.toml --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp core/target/aarch64-linux-android/release/libyumigram_core.so android/app/src/main/jniLibs/arm64-v8a/libyumigram_core.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libyumigram_core.so

      - name: Build Signed Release and Debug APKs
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/yumigram-release.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/yumigram-debug.apk
          fi
          ls -lh release-artifacts/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: yumigram-apks
          path: release-artifacts/*
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=Yumigram ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          files: release-artifacts/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
